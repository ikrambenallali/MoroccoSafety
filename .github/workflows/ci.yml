name: CI

on:
  push:
    branches: [main, ci/cd]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint API
        run: npm --workspace apps/api run lint || echo "No lint"

      - name: Test API
        run: npm --workspace apps/api test || echo "No tests"

      - name: Build API
        run: npm --workspace apps/api run build

      - name: Build Web
        run: npm --workspace apps/web run build