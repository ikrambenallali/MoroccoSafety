services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root  
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: moroccosafety_api
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 3000
      MONGO_URI: mongodb://root:example@mongo:27017/moroccosafety?authSource=admin
      JWT_SECRET: your-super-secret-jwt-key-here
      NODE_ENV: production
    ports:
      - "3000:3000"
    # In production the source mount may hide built node_modules/dist from image
    # volumes:
    #   - ./apps/api:/app
    command: ["npm","run","start:prod"]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: moroccosafety_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://api:3000
      NODE_ENV: production
    ports:
      - "3001:3001"
    # In production the source mount may hide built node_modules/.next from image
    # volumes:
    #   - ./apps/web:/app
    command: ["npm","run","start"]

volumes:
  mongo_data: