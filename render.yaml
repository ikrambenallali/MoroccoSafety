services:
  # Backend API
  - type: web
    name: morocco-safety-api
    plan: free
    image: ikram2003/moroccosafety-api:latest # This is fine for the API
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

  # Frontend Web
  - type: web
    name: morocco-safety-web
    plan: free
    runtime: docker   # <-- Change from image to runtime: docker
    dockerContext: .   # Context is the project root for monorepos
    dockerfilePath: ./apps/web/Dockerfile # Use the local Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://morocco-safety-api.onrender.com # Use the real URL here
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
