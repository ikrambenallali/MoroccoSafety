services:
  # Backend API
  - type: web
    name: morocco-safety-api
    plan: free
    image: ikram2003/moroccosafety-api:latest  # Replace with your image
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

  # Frontend Web
  - type: web
    name: morocco-safety-web
    plan: free
    image: ikram2003/moroccosafety-web:latest # Replace with your image
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: morocco-safety-api
          property: host
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
